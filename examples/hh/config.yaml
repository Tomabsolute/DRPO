output_dir: ./output/hh/

gradient_checkpointing: true
model_and_preference_share_basemodel: false  

per_device_train_batch_size: 2
gradient_accumulation_steps: 8   

learning_rate: 1.0e-6  

max_length: 2048

generate_temperature: 0.7
forward_temperature: 0.7

beta: 0.1   

bf16: true

dataset_num_proc: 1

num_astar: 1

torch_empty_cache_steps: 1

num_train_epochs: 1

eval_steps: 500
eval_strategy: "no"

save_strategy: "steps"
save_steps: 1000

logging_steps: 50

push_to_hub: false

is_bt_model: true

preference_model_id: Kyleyee/Qwen2.5-7B-reward-hh
preference_model_revision: main  

preference_model_kwargs:
  indifferent: false
  random: false
  reverse: false

ratio_processing: clip
clipbound: 2.0 

max_grad_norm: 0.25

loss1_only: false
loss2_only: false