runtime:
  # clip -> use trainer (clip variant), no_clip -> use trainer_2
  trainer_variant: no_clip
  augment_swap: true
  seed: 996
  policy_padding_side: left
  # used only when dataset_mix is set and eval_strategy != "no"
  eval_size: 0.02
  # policy_eos_token: "<|im_end|>"

script_args:
  # Option A: single dataset
  # dataset_name: "YOUR_DATASET_NAME"
  # dataset_config_name: "default"
  dataset_train_split: "train"
  dataset_test_split: "test"
  # Option B: mix multiple datasets by percentage (recommended)
  # weights will be normalized automatically
  dataset_mix:
    - dataset_name: "HuggingFaceH4/ultrafeedback_binarized"
      split: "train_prefs"
      weight: 0.7
    - dataset_name: "nvidia/HelpSteer2"
      dataset_config_name: "preference"
      split: "train"
      weight: 0.2
    - dataset_name: "argilla/distilabel-intel-orca-dpo-pairs"
      split: "train"
      weight: 0.1
  mix_stopping_strategy: "all_exhausted"

model_args:
  # Replace with your base policy model, e.g. meta-llama/Meta-Llama-3-8B-Instruct
  model_name_or_path: "meta-llama/Llama-3.1-8B-Instruct"

output_dir: ./output/general/

gradient_checkpointing: true
model_and_preference_share_basemodel: false

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-6

max_length: 2048
generate_temperature: 0.7
forward_temperature: 0.7
beta: 0.04

bf16: true
dataset_num_proc: 1
num_astar: 1
torch_empty_cache_steps: 50
num_train_epochs: 1

eval_steps: 500
eval_strategy: "no"
save_strategy: "steps"
save_steps: 1000
logging_steps: 50
push_to_hub: false

is_bt_model: true
preference_model_id: "Skywork/Skywork-Reward-V2-Llama-3.1-8B"
preference_model_revision: "main"
preference_model_kwargs:
  indifferent: false
  random: false
  reverse: false

ratio_processing: clip
clipbound: 2.5
max_grad_norm: 0.25

loss1_only: false
loss2_only: false
