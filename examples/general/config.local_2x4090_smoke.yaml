runtime:
  # clip -> use trainer (clip variant), no_clip -> use trainer_2
  trainer_variant: no_clip
  augment_swap: true
  seed: 996
  policy_padding_side: left
  # used only when dataset_mix is set and eval_strategy != "no"
  eval_size: 0.02

script_args:
  dataset_train_split: "train"
  dataset_test_split: "test"
  # Use tiny slices for smoke test to validate pipeline end-to-end.
  dataset_mix:
    - dataset_name: "HuggingFaceH4/ultrafeedback_binarized"
      split: "train_prefs[:200]"
      weight: 0.7
    - dataset_name: "nvidia/HelpSteer2"
      dataset_config_name: "preference"
      split: "train[:100]"
      weight: 0.2
    - dataset_name: "argilla/distilabel-intel-orca-dpo-pairs"
      split: "train[:100]"
      weight: 0.1
  mix_stopping_strategy: "all_exhausted"

model_args:
  # Smaller base model for local bring-up
  model_name_or_path: "Qwen/Qwen2.5-0.5B-Instruct"

output_dir: ./output/general_smoke/

gradient_checkpointing: true
model_and_preference_share_basemodel: false

per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 5.0e-7
max_steps: 30

max_length: 256
generate_temperature: 0.7
forward_temperature: 0.7
beta: 0.04

bf16: true
dataset_num_proc: 1
num_astar: 1
torch_empty_cache_steps: 1
num_train_epochs: 1

eval_steps: 50
eval_strategy: "no"
save_strategy: "steps"
save_steps: 50
logging_steps: 5
push_to_hub: false

is_bt_model: true
preference_model_id: "OpenAssistant/reward-model-deberta-v3-base"
preference_model_revision: "main"
preference_model_kwargs:
  indifferent: false
  random: false
  reverse: false

ratio_processing: clip
clipbound: 2.0
max_grad_norm: 0.25

loss1_only: false
loss2_only: false
